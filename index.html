<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>포럼 자료 검토용</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  body{ margin:0; background:#0d0f30; color:#eef0fb; font-family:-apple-system,"Noto Sans KR",sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .wrap{ max-width:480px; width:100%; text-align:center; }
  h1{ font-size:1.05rem; margin-bottom:16px; }
  h2{ font-size:0.95rem; margin:28px 0 12px; color:#eef0fb; }
  video{ width:100%; border-radius:12px; }
  p{ font-size:0.8rem; color:#9db1ff; margin-top:12px; }
  a.btn{ display:inline-block; margin-top:8px; padding:12px 20px; background:#3b5bfd; color:#fff; border-radius:8px; text-decoration:none; font-size:0.9rem; }
  .badge{ display:inline-block; font-size:0.7rem; background:#ff5b5b; color:#fff; padding:2px 8px; border-radius:6px; margin-bottom:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>2026 대한민국 자원봉사 활력포럼 — 오프닝 영상 (검토용, 임시)</h1>

  <h2>① 확정본 (라이브 파일과 동일, 99.5초)</h2>
  <video controls playsinline src="opening.mp4"></video>
  <p>번호 포함, 리플로우 없이 그대로 중앙이동 · 확정본</p>

  <h2>② 전문가버전 (프로덕션 업그레이드, 실험 — 아직 미승인)</h2>
  <span class="badge">검토용</span>
  <video controls playsinline src="opening_expert.mp4"></video>
  <p>99.53초 · 코덱스+총괄 협의 반영(사운드 재설계/비네팅·그레인/문장호흡 페이싱 등) · 서사 동일, 연출만 업그레이드</p>

  <h2>진행 큐카드 (사회자·좌장용, 센터장 소개/마무리 멘트 추가 반영)</h2>
  <a class="btn" href="qcard.pdf">PDF 열기</a>
</div>
</body>
</html>
